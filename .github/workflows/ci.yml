name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        task: [fmt-check, lint, actions-lint]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install mise tools
        uses: jdx/mise-action@v4
      - name: Run ${{ matrix.task }}
        run: mise run ${{ matrix.task }}

  test:
    name: Test / linux
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install mise tools
        uses: jdx/mise-action@v4
      - name: Run tests
        run: mise run test

  build:
    name: Build / ${{ matrix.goos }}-amd64
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
    env:
      CGO_ENABLED: "0"
      GOARCH: amd64
      GOOS: ${{ matrix.goos }}
      VERSION: ci-${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install mise tools
        uses: jdx/mise-action@v4
      - name: Build archive
        run: mise run archive
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: xoldot-${{ matrix.goos }}-amd64
          path: dist/xoldot-${{ env.VERSION }}-${{ matrix.goos }}-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7
