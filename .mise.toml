min_version = "2026.8.3"

[tools]
actionlint = "1.7.12"
go = "1.27.0"
golangci-lint = "2.13.0"
node = "24.19.0"

[tasks.tidy]
description = "Update Go module metadata"
run = "go mod tidy"

[tasks.fmt]
description = "Format Go sources"
run = "go fmt ./..."

[tasks.fmt-check]
description = "Check Go source formatting"
run = '''
files="$(gofmt -l .)"
test -z "$files" || { printf '%s\n' "$files"; exit 1; }
'''

[tasks.lint]
description = "Lint Go sources"
run = "golangci-lint run"

[tasks.actions-lint]
description = "Lint GitHub Actions workflows"
run = "actionlint"

[tasks.test]
description = "Run the test suite"
run = "go test ./..."

[tasks.build]
description = "Build the xoldot binary"
run = "go build -trimpath -o dist/xoldot ./cmd/xoldot"

[tasks.run]
description = "Run xoldot from source"
run = "go run ./cmd/xoldot"

[tasks.package]
description = "Build a versioned release binary"
run = '''
mkdir -p dist
version="${VERSION:-dev}"
target_os="${GOOS:-$(go env GOOS)}"
target_arch="${GOARCH:-$(go env GOARCH)}"
binary="xoldot-${version}-${target_os}-${target_arch}"
CGO_ENABLED="${CGO_ENABLED:-0}" GOOS="$target_os" GOARCH="$target_arch" \
  go build -trimpath -ldflags "-s -w -X main.version=$version" -o "dist/$binary" ./cmd/xoldot
'''

[tasks.archive]
description = "Archive a versioned release binary"
depends = ["package"]
run = '''
version="${VERSION:-dev}"
target_os="${GOOS:-$(go env GOOS)}"
target_arch="${GOARCH:-$(go env GOARCH)}"
binary="xoldot-${version}-${target_os}-${target_arch}"
tar -czf "dist/${binary}.tar.gz" -C dist "$binary"
'''

[tasks.install]
description = "Install xoldot into GOBIN"
run = "go install ./cmd/xoldot"

[tasks.check]
description = "Run all repository checks"
depends = ["fmt-check", "lint", "actions-lint", "test", "build"]
